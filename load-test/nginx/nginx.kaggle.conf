worker_processes 1;
pid nginx.pid;
error_log logs/error.log notice;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    access_log logs/access.log;
    client_body_temp_path temp/client;
    proxy_temp_path temp/proxy;

    upstream cinema_api {
        server 127.0.0.1:8081 max_fails=3 fail_timeout=5s;
        server 127.0.0.1:8082 max_fails=3 fail_timeout=5s;
        keepalive 16;
    }

    server {
        listen 8080;

        location = /nginx-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /actuator {
            return 404;
        }

        location ^~ /actuator/ {
            return 404;
        }

        location / {
            proxy_pass http://cinema_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            add_header X-Cinema-Upstream $upstream_addr always;
        }
    }
}
